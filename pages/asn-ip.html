<div id="asn-ip" class="section-content" style="display: none;">
    <h2>ASN & IP Discovery</h2>
    <p>Discover ASN and IP ranges associated with your target organization.</p>
    
    <!-- Tools will be added here -->
    <div class="tool">
        <h3>Whois Lookup</h3>
        <div class="command-box">
            <pre class="command-text" data-template="whois {url}">whois {url}</pre>
            <button class="copy-button" type="button">Copy</button>
        </div>
    </div>
    
    <div class="tool">
        <h3>ASN Lookup</h3>
        <div class="command-box">
            <pre class="command-text" data-template="whois -h whois.radb.net -- '-i origin AS{asn}'">whois -h whois.radb.net -- '-i origin AS{asn}'</pre>
            <button class="copy-button" type="button">Copy</button>
        </div>
    </div>
</div>
