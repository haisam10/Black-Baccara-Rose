<div id="live-host" class="section-content" style="display: none;">
    <h2>Live Host Discovery</h2>
    <p>Identify active hosts on your target network.</p>
    
    <div class="tool">
        <h3>Ping Sweep</h3>
        <div class="command-box">
            <pre class="command-text" data-template="ping -c 1 {url}">ping -c 1 {url}</pre>
            <button class="copy-button" type="button">Copy</button>
        </div>
    </div>
</div>
